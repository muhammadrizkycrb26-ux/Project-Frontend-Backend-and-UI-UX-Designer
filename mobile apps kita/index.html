<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LMS - Login Mobile (iPhone 17 Pro Max)</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Controls Bar (Hanya tampil saat dibuka di browser desktop / preview) -->
  <aside class="preview-toolbar" id="previewToolbar">
    <div class="toolbar-info">
      <span class="device-badge">📱 iPhone 17 Pro Max</span>
      <span class="device-res">440 × 956 pt</span>
    </div>
    <div class="toolbar-actions">
      <button id="toggleFrameBtn" class="btn-tool" title="Ganti antara tampilan Frame HP atau Full Viewport">
        Toggle Frame HP
      </button>
      <button id="themeToggleBtn" class="btn-tool" title="Ganti background desktop">
        Ganti Latar
      </button>
    </div>
  </aside>

  <!-- Container Utama Layar Mobile -->
  <main class="mobile-wrapper" id="mobileWrapper">
    <!-- Frame Bezel iPhone 17 Pro Max -->
    <div class="iphone-bezel" id="iphoneBezel">
      
      <!-- Screen Canvas (440 x 956 px) -->
      <section class="screen-canvas" id="screenCanvas">
        
        <!-- Status Bar iOS (iPhone 17 Pro Max) -->
        <header class="ios-status-bar">
          <div class="status-left">
            <span class="ios-clock">17:20</span>
          </div>

          <!-- Dynamic Island (Khas iPhone seri Pro/Pro Max) -->
          <div class="dynamic-island" title="Dynamic Island iPhone 17 Pro Max">
            <div class="island-camera"></div>
            <div class="island-sensor"></div>
          </div>

          <div class="status-right">
            <!-- Cellular Signal Icon -->
            <svg class="ios-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M2 17h3v4H2v-4zm6-4h3v8H8v-8zm6-4h3v12h-3V9zm6-5h3v17h-3V4z"/>
            </svg>
            <!-- Wi-Fi Icon -->
            <svg class="ios-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.5c3.78 0 7.21 1.5 9.7 3.96L12 18.25 2.3 11.46C4.79 8.99 8.22 7.5 12 7.5z"/>
            </svg>
            <!-- Battery Icon -->
            <div class="ios-battery">
              <div class="battery-body">
                <div class="battery-level"></div>
              </div>
              <div class="battery-cap"></div>
            </div>
          </div>
        </header>

        <!-- Area Konten Utama -->
        <div class="screen-body">

          <!-- Branding Logo LMS & Topi Toga -->
          <div class="brand-section">
            <div class="cap-logo-wrapper">
              <!-- Topi Toga (Mortarboard Cap) Vector SVG -->
              <svg class="cap-svg" viewBox="0 0 160 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <linearGradient id="capTopGrad" x1="10" y1="20" x2="150" y2="70" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#38B6FF" />
                    <stop offset="50%" stop-color="#1B9BF0" />
                    <stop offset="100%" stop-color="#0E81D6" />
                  </linearGradient>
                  <linearGradient id="capUnderGrad" x1="45" y1="55" x2="115" y2="85" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#158DE0" />
                    <stop offset="100%" stop-color="#0C6DBA" />
                  </linearGradient>
                  <linearGradient id="capTasselGrad" x1="105" y1="42" x2="140" y2="80" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#47BDFF" />
                    <stop offset="100%" stop-color="#1088DE" />
                  </linearGradient>
                  <filter id="capShadow" x="0" y="5" width="160" height="115" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
                    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1B9BF0" flood-opacity="0.25"/>
                  </filter>
                </defs>

                <!-- Bagian Bawah Topi (Headband/Cap) -->
                <path d="M44 54V72C44 82 60 90 80 90C100 90 116 82 116 72V54C106 60 93 63 80 63C67 63 54 60 44 54Z" 
                      fill="url(#capUnderGrad)" />
                <path d="M44 72C44 82 60 90 80 90C100 90 116 82 116 72" 
                      stroke="#42B8FF" stroke-width="2" stroke-linecap="round" />

                <!-- Bagian Belah Ketupat Atas (Diamond Mortarboard Top) -->
                <polygon points="80,18 150,46 80,74 10,46" 
                         fill="url(#capTopGrad)" 
                         filter="url(#capShadow)" />
                <polygon points="80,21 146,46 80,71 14,46" 
                         stroke="rgba(255,255,255,0.4)" stroke-width="1.5" fill="none" />

                <!-- Tombol/Kancing Tengah -->
                <ellipse cx="80" cy="46" rx="4" ry="2.5" fill="#E1F3FF" />

                <!-- Tali & Rumbai Tassel -->
                <path d="M80 46 C95 47 114 53 118 63 L118 78" 
                      stroke="url(#capTasselGrad)" stroke-width="3" stroke-linecap="round" fill="none" />
                <rect x="114" y="78" width="8" height="12" rx="2" fill="#209CF3" />
                <path d="M118 90 L118 96" stroke="#209CF3" stroke-width="4" stroke-linecap="round" />
              </svg>
            </div>

            <h1 class="brand-title">LMS</h1>
            <p class="brand-subtitle">
              Your Learning Journey<br>
              Starts Here
            </p>
          </div>

          <!-- Form Login -->
          <form class="login-form" id="loginForm" autocomplete="on">
            
            <!-- Input ID / NIP / NIM -->
            <div class="input-group">
              <span class="input-icon-left" aria-hidden="true">
                <!-- User / ID Icon -->
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
              </span>
              <input 
                type="text" 
                id="usernameInput" 
                class="form-control" 
                placeholder="ID / NIP / NIM" 
                required 
                autocomplete="username"
                spellcheck="false"
              >
            </div>

            <!-- Input Password -->
            <div class="input-group">
              <span class="input-icon-left" aria-hidden="true">
                <!-- Lock Icon -->
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </span>
              <input 
                type="password" 
                id="passwordInput" 
                class="form-control" 
                placeholder="Password" 
                required 
                autocomplete="current-password"
              >
              <!-- Toggle Visibility Password Button -->
              <button 
                type="button" 
                id="togglePasswordBtn" 
                class="input-icon-right" 
                aria-label="Tampilkan atau sembunyikan password"
              >
                <!-- Eye Icon (Default) -->
                <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <!-- Eye-Off Icon (Hidden by default) -->
                <svg id="eyeOffIcon" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>

            <!-- Options Row: Ingat Saya & Lupa Password -->
            <div class="form-options-row">
              <label class="checkbox-container">
                <input type="checkbox" id="rememberMe" checked>
                <span class="custom-checkbox">
                  <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                  </svg>
                </span>
                <span class="checkbox-label">Ingat saya</span>
              </label>

              <a href="#forgot" id="forgotPassLink" class="link-forgot">Lupa password?</a>
            </div>

            <!-- Tombol Masuk -->
            <div class="btn-group">
              <button type="submit" id="submitBtn" class="btn-primary">
                <span>Masuk</span>
              </button>
            </div>

            <!-- Footer: Hubungi Administrator -->
            <footer class="form-footer">
              <span class="footer-prompt">Belum punya akun?</span>
              <a href="#admin" id="contactAdminLink" class="footer-link">Hubungi Administrator</a>
            </footer>

          </form>

        </div>

        <!-- Home Indicator Bar iOS (Bawah Layar) -->
        <footer class="ios-home-indicator-area">
          <div class="ios-home-indicator"></div>
        </footer>

        <!-- Toast Feedback Notification (Mobile Native Style) -->
        <div id="toastNotification" class="toast-popup" role="status" aria-live="polite">
          <span id="toastMessage">Berhasil masuk</span>
        </div>

      </section>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
